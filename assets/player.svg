<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="100%" height="100%">
  <defs>
    <linearGradient id="playerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="albumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="borderGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <style>
    @keyframes bounce1 { 0%, 100% { transform: scaleY(0.25); } 50% { transform: scaleY(1); } }
    @keyframes bounce2 { 0%, 100% { transform: scaleY(0.85); } 50% { transform: scaleY(0.3); } }
    @keyframes bounce3 { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(0.95); } }
    @keyframes spinDisc { 100% { transform: rotate(360deg); } }

    .eq-bar { transform-origin: bottom; transform-box: fill-box; fill: url(#barGrad); rx: 2px; }
    .bar-1 { animation: bounce1 1.1s ease-in-out infinite; }
    .bar-2 { animation: bounce2 0.85s ease-in-out infinite 0.15s; }
    .bar-3 { animation: bounce3 1.3s ease-in-out infinite 0.25s; }
    .bar-4 { animation: bounce1 0.95s ease-in-out infinite 0.4s; }
    .bar-5 { animation: bounce2 1.2s ease-in-out infinite 0.1s; }
    .bar-6 { animation: bounce3 0.75s ease-in-out infinite 0.3s; }
    .bar-7 { animation: bounce1 1.05s ease-in-out infinite 0.2s; }
    .bar-8 { animation: bounce2 1.4s ease-in-out infinite 0.35s; }
    .bar-9 { animation: bounce3 0.9s ease-in-out infinite 0.05s; }
    .bar-10 { animation: bounce1 1.15s ease-in-out infinite 0.22s; }
    .bar-11 { animation: bounce2 0.8s ease-in-out infinite 0.18s; }
    .bar-12 { animation: bounce3 1.25s ease-in-out infinite 0.28s; }

    .disc { transform-origin: 65px 70px; animation: spinDisc 8s linear infinite; }
  </style>

  <!-- Frame -->
  <rect x="2" y="2" width="846" height="136" rx="12" fill="url(#playerBg)" stroke="url(#borderGrad2)" stroke-width="1.2" />

  <!-- Album Art / Vinyl Disc -->
  <rect x="20" y="25" width="90" height="90" rx="8" fill="url(#albumGrad)" />
  <circle cx="65" cy="70" r="32" fill="#090d16" stroke="#1e293b" stroke-width="2" />
  <g class="disc">
    <circle cx="65" cy="70" r="24" fill="none" stroke="#2a3548" stroke-width="1.5" stroke-dasharray="3,3" />
    <circle cx="65" cy="70" r="16" fill="none" stroke="#38bdf8" stroke-width="1" />
  </g>
  <circle cx="65" cy="70" r="8" fill="#ec4899" />
  <circle cx="65" cy="70" r="3" fill="#ffffff" />

  <!-- Track Meta -->
  <text x="130" y="46" font-family="'Fira Code', monospace" font-size="11px" font-weight="bold" fill="#38bdf8" letter-spacing="1">● NOW CODING &amp; STREAMING</text>
  <text x="130" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17px" font-weight="bold" fill="#f8fafc">The Rebel Path (Cyberpunk 2077 Synthwave)</text>
  <text x="130" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13px" fill="#94a3b8">P.T. Adamczyk • Deep Work Neural Flow</text>

  <!-- Progress Bar -->
  <text x="130" y="112" font-family="'Fira Code', monospace" font-size="11px" fill="#64748b">02:14</text>
  <rect x="175" y="105" width="300" height="5" rx="2.5" fill="#1e293b" />
  <rect x="175" y="105" width="190" height="5" rx="2.5" fill="url(#barGrad)" />
  <circle cx="365" cy="107.5" r="5" fill="#38bdf8" />
  <text x="485" y="112" font-family="'Fira Code', monospace" font-size="11px" fill="#64748b">03:38</text>

  <!-- Controls Icons (Vector SVG) -->
  <g transform="translate(550, 48)">
    <!-- Shuffle -->
    <path d="M 0 10 L 8 10 L 16 22 L 24 22 M 20 18 L 24 22 L 20 26 M 0 22 L 8 22 L 11 17.5 M 13 14.5 L 16 10 L 24 10 M 20 6 L 24 10 L 20 14" stroke="#64748b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Prev -->
    <path d="M 40 8 L 40 24 M 52 8 L 42 16 L 52 24 Z" fill="#94a3b8" />
    <!-- Play/Pause Circle -->
    <circle cx="76" cy="16" r="16" fill="#38bdf8" />
    <rect x="71" y="10" width="3.5" height="12" rx="1.5" fill="#090d16" />
    <rect x="77.5" y="10" width="3.5" height="12" rx="1.5" fill="#090d16" />
    <!-- Next -->
    <path d="M 112 8 L 112 24 M 100 8 L 110 16 L 100 24 Z" fill="#94a3b8" />
    <!-- Repeat -->
    <path d="M 126 12 A 7 7 0 1 1 126 20 M 122 12 L 126 8 L 130 12" stroke="#64748b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Jumping Equalizer Bars on Right -->
  <g transform="translate(710, 48)">
    <rect x="0" y="0" width="5" height="34" class="eq-bar bar-1" />
    <rect x="9" y="0" width="5" height="34" class="eq-bar bar-2" />
    <rect x="18" y="0" width="5" height="34" class="eq-bar bar-3" />
    <rect x="27" y="0" width="5" height="34" class="eq-bar bar-4" />
    <rect x="36" y="0" width="5" height="34" class="eq-bar bar-5" />
    <rect x="45" y="0" width="5" height="34" class="eq-bar bar-6" />
    <rect x="54" y="0" width="5" height="34" class="eq-bar bar-7" />
    <rect x="63" y="0" width="5" height="34" class="eq-bar bar-8" />
    <rect x="72" y="0" width="5" height="34" class="eq-bar bar-9" />
    <rect x="81" y="0" width="5" height="34" class="eq-bar bar-10" />
    <rect x="90" y="0" width="5" height="34" class="eq-bar bar-11" />
    <rect x="99" y="0" width="5" height="34" class="eq-bar bar-12" />
  </g>
</svg>
