<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" width="100%" height="100%">
  <defs>
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#080d1a" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="nodeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="gpuBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>
    <pattern id="blueprintGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#111827" stroke-width="0.7" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseTrace {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodeBlink {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.3; }
    }
    @keyframes pingLed {
      0% { r: 3.5px; opacity: 1; }
      100% { r: 8px; opacity: 0; }
    }
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; }
    .wire { stroke: #1e293b; stroke-width: 1.5; fill: none; }
    .wire-active { stroke: #38bdf8; stroke-width: 1.8; stroke-dasharray: 8, 12; animation: pulseTrace 2s linear infinite; fill: none; }
    .wire-active-green { stroke: #10b981; stroke-width: 1.8; stroke-dasharray: 8, 12; animation: pulseTrace 2.5s linear infinite; fill: none; }
    .label-header { font-size: 11px; fill: #64748b; letter-spacing: 1.5px; font-weight: 600; }
    .node-title { font-size: 12.5px; fill: #f8fafc; font-weight: 700; letter-spacing: 0.5px; }
    .node-meta { font-size: 11px; fill: #94a3b8; }
    .node-accent { font-size: 11px; fill: #38bdf8; font-weight: 600; }
    .node-green { font-size: 11px; fill: #34d399; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="920" height="350" rx="12" fill="url(#canvasGrad)" stroke="#1e293b" stroke-width="1.2" />
  <rect width="920" height="350" rx="12" fill="url(#blueprintGrid)" />

  <!-- Top Technical Header Bar -->
  <line x1="0" y1="38" x2="920" y2="38" stroke="#1e293b" stroke-width="1" />
  <circle cx="24" cy="19" r="4" fill="#10b981" />
  <circle cx="24" cy="19" r="4" fill="none" stroke="#10b981" stroke-width="1.5">
    <animate attributeName="r" values="4;9" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.9;0" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="38" y="23" class="mono label-header">CLUSTER TOPOLOGY // NODE: HABIB (<tspan fill="#38bdf8">W-ZO</tspan>) // HYBRID EDGE-TO-CLOUD RUNTIME</text>
  <text x="896" y="23" text-anchor="end" class="mono" font-size="10.5px" fill="#10b981">LATENCY: 72MS · APC: 94.8%</text>

  <!-- Connecting Bus Lines -->
  <!-- Wire 1: Edge to Cloud -->
  <path d="M 220 185 L 340 185" class="wire" />
  <path d="M 220 185 L 340 185" class="wire-active" />

  <!-- Wire 2: Cloud to Subsystems -->
  <path d="M 610 145 L 700 115" class="wire" />
  <path d="M 610 145 L 700 115" class="wire-active" />
  <path d="M 610 225 L 700 255" class="wire" />
  <path d="M 610 225 L 700 255" class="wire-active-green" />

  <!-- NODE 1: LOCAL EDGE CLIENT -->
  <g transform="translate(25, 75)">
    <rect width="195" height="220" rx="10" fill="#090d16" stroke="url(#nodeBorder)" stroke-width="1.4" />
    <rect x="12" y="14" width="28" height="28" rx="6" fill="#1e293b" />
    <text x="26" y="33" text-anchor="middle" class="mono" font-size="14px" fill="#38bdf8">📱</text>
    <text x="48" y="26" class="mono label-header">EDGE ORIGIN</text>
    <text x="48" y="39" class="mono node-title">Termux / Linux</text>
    <line x1="12" y1="54" x2="183" y2="54" stroke="#1e293b" stroke-width="1" />
    
    <text x="12" y="78" class="mono node-meta">Architecture: <tspan class="node-accent">aarch64</tspan></text>
    <text x="12" y="100" class="mono node-meta">Engine: <tspan class="node-accent">SQLite WAL</tspan></text>
    <text x="12" y="122" class="mono node-meta">CLI: <tspan class="node-accent">molab-cli v2.5</tspan></text>
    <text x="12" y="144" class="mono node-meta">Bridge: <tspan class="node-accent">REST Streaming</tspan></text>
    <text x="12" y="166" class="mono node-meta">PTY Hazard: <tspan class="node-green">ELIMINATED</tspan></text>
    <rect x="12" y="182" width="171" height="24" rx="4" fill="#0d1527" stroke="#1e293b" />
    <text x="22" y="198" class="mono" font-size="10px" fill="#38bdf8">● DAEMON SUPERVISOR ACTIVE</text>
  </g>

  <!-- PROTOCOL BADGE ON THE BUS -->
  <g transform="translate(230, 168)">
    <rect width="100" height="34" rx="6" fill="#080c14" stroke="#38bdf8" stroke-width="1" />
    <text x="50" y="16" text-anchor="middle" class="mono" font-size="9.5px" fill="#94a3b8">NATIVE HTTP</text>
    <text x="50" y="28" text-anchor="middle" class="mono" font-size="10px" fill="#38bdf8" font-weight="bold">SSE STREAM</text>
  </g>

  <!-- NODE 2: CLOUD GPU CLUSTER (THE CENTERPIECE) -->
  <g transform="translate(340, 60)">
    <rect width="270" height="250" rx="10" fill="#09111e" stroke="url(#gpuBorder)" stroke-width="1.8" />
    <rect x="16" y="16" width="34" height="34" rx="6" fill="#064e3b" />
    <text x="33" y="39" text-anchor="middle" class="mono" font-size="18px" fill="#34d399">⚡</text>
    <text x="58" y="28" class="mono label-header" fill="#34d399">COREWEAVE POD // CLOUD</text>
    <text x="58" y="43" class="mono node-title">NVIDIA RTX PRO 6000</text>
    <line x1="16" y1="60" x2="254" y2="60" stroke="#1e293b" stroke-width="1" />

    <text x="16" y="84" class="mono node-meta">Architecture: <tspan class="node-green">Blackwell (GB202)</tspan></text>
    <text x="16" y="106" class="mono node-meta">VRAM Memory: <tspan class="node-green">96GB GDDR7</tspan></text>
    <text x="16" y="128" class="mono node-meta">Bandwidth: <tspan class="node-green">1.8 TB/s Saturation</tspan></text>
    <text x="16" y="150" class="mono node-meta">Kernel Dispatch: <tspan class="node-accent">FlashInfer Fused</tspan></text>
    <text x="16" y="172" class="mono node-meta">Prefix Cache (APC): <tspan class="node-green">94.8% Hit Rate</tspan></text>
    <text x="16" y="194" class="mono node-meta">TTFT Baseline: <tspan class="node-green">&lt; 78ms (Chunked)</tspan></text>

    <!-- Mini Telemetry Meter -->
    <rect x="16" y="210" width="238" height="26" rx="5" fill="#051515" stroke="#10b981" stroke-width="0.8" />
    <text x="26" y="227" class="mono" font-size="10.5px" fill="#34d399">100% IN-NOTEBOOK MARIMO VAULT</text>
  </g>

  <!-- NODE 3A: AUTONOMOUS AGENT RUNTIME -->
  <g transform="translate(700, 60)">
    <rect width="195" height="112" rx="9" fill="#090d16" stroke="url(#nodeBorder)" stroke-width="1.3" />
    <text x="14" y="24" class="mono label-header">MULTI-AGENT CORE</text>
    <text x="14" y="42" class="mono node-title">Hermes + CLI-Anything</text>
    <line x1="14" y1="52" x2="181" y2="52" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="72" class="mono node-meta">• Self-improving learning loop</text>
    <text x="14" y="90" class="mono node-meta">• AST CLI harness generator</text>
    <text x="14" y="104" class="mono node-accent">• 48-Tool MCP Model Protocol</text>
  </g>

  <!-- NODE 3B: NEURAL VOICE PIPELINE -->
  <g transform="translate(700, 198)">
    <rect width="195" height="112" rx="9" fill="#090d16" stroke="url(#gpuBorder)" stroke-width="1.3" />
    <text x="14" y="24" class="mono label-header" fill="#34d399">CONVERSATIONAL AI</text>
    <text x="14" y="42" class="mono node-title">Indic Neural Voice</text>
    <line x1="14" y1="52" x2="181" y2="52" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="72" class="mono node-meta">• Sub-200ms acoustic synthesis</text>
    <text x="14" y="90" class="mono node-meta">• Full-duplex telephony bots</text>
    <text x="14" y="104" class="mono node-green">• MergeKit brain architecture</text>
  </g>
</svg>