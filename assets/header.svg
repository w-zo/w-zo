<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%">
  <defs>
    <linearGradient id="headBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#080f1e" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <radialGradient id="halo" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <pattern id="headGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#111827" stroke-width="0.6" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseLed {
      0%, 100% { fill: #10b981; filter: drop-shadow(0 0 6px #10b981); }
      50% { fill: #059669; filter: drop-shadow(0 0 2px #059669); }
    }
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .status-led { animation: pulseLed 2s ease-in-out infinite; }
  </style>

  <!-- Background Canvas -->
  <rect width="920" height="180" rx="14" fill="url(#headBg)" stroke="#1f2937" stroke-width="1.2" />
  <rect width="920" height="180" rx="14" fill="url(#halo)" />
  <rect width="920" height="180" rx="14" fill="url(#headGrid)" />

  <!-- Top Accent Line -->
  <rect x="1" y="1" width="918" height="2.5" rx="1" fill="url(#accentGrad)" />

  <!-- Left Content -->
  <g transform="translate(36, 42)">
    <text x="0" y="0" class="mono" font-size="11px" fill="#64748b" letter-spacing="1.8px" font-weight="600">// AUTONOMOUS AGENTS &amp; CLOUD GPU INFRASTRUCTURE</text>
    
    <g transform="translate(0, 38)">
      <text x="0" y="0" class="sans" font-size="40px" font-weight="800" fill="#f8fafc" letter-spacing="-0.5px">HABIB</text>
      <rect x="145" y="-26" width="75" height="24" rx="6" fill="#0d1d33" stroke="#38bdf8" stroke-width="0.9" />
      <text x="182.5" y="-10" text-anchor="middle" class="mono" font-size="11.5px" fill="#38bdf8" font-weight="bold">@w-zo</text>
    </g>

    <text x="0" y="68" class="sans" font-size="14px" fill="#94a3b8" font-weight="400">Architecting agent-native runtimes, 96GB Blackwell GPU orchestrators &amp; neural voice pipelines.</text>
  </g>

  <!-- Right Technical Spec Pill -->
  <g transform="translate(650, 42)">
    <rect width="234" height="96" rx="10" fill="#070d18" stroke="#1e293b" stroke-width="1" />
    
    <g transform="translate(16, 24)">
      <circle cx="4" cy="-1" r="4" class="status-led" />
      <text x="16" y="3" class="mono" font-size="11px" fill="#34d399" font-weight="bold">SYSTEMS OPERATIONAL</text>
    </g>

    <line x1="16" y1="36" x2="218" y2="36" stroke="#1e293b" stroke-width="1" />

    <text x="16" y="56" class="mono" font-size="10.5px" fill="#64748b">COMPUTE : <tspan fill="#f1f5f9">Blackwell 96GB</tspan></text>
    <text x="16" y="74" class="mono" font-size="10.5px" fill="#64748b">LATENCY : <tspan fill="#38bdf8">&lt; 78ms TTFT</tspan></text>
    <text x="16" y="92" class="mono" font-size="10.5px" fill="#64748b">RUNTIME : <tspan fill="#a855f7">Termux + CoreWeave</tspan></text>
  </g>
</svg>