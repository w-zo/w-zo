<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%">
  <defs>
    <linearGradient id="termCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <style>
    @keyframes termBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; }
    .term-title { font-size: 11.5px; fill: #64748b; font-weight: 600; letter-spacing: 0.5px; }
    .t-prompt { font-size: 12.5px; fill: #38bdf8; font-weight: 700; }
    .t-cmd { font-size: 12.5px; fill: #f8fafc; font-weight: 500; }
    .t-dim { font-size: 12px; fill: #64748b; }
    .t-key { font-size: 12px; fill: #818cf8; }
    .t-val { font-size: 12px; fill: #e2e8f0; }
    .t-str { font-size: 12px; fill: #34d399; }
    .t-num { font-size: 12px; fill: #f59e0b; }
    .t-success { font-size: 12px; fill: #10b981; font-weight: 600; }
    .t-info { font-size: 12px; fill: #38bdf8; }
    .cursor-box { animation: termBlink 1s infinite; fill: #38bdf8; }
  </style>

  <!-- Shell Frame -->
  <rect width="920" height="380" rx="12" fill="url(#termCanvas)" stroke="url(#termBorder)" stroke-width="1.2" />
  
  <!-- Header Bar -->
  <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 908 0 C 914.63 0 920 5.37 920 12 L 920 34 L 0 34 Z" fill="#090d16" />
  <line x1="0" y1="34" x2="920" y2="34" stroke="#1e293b" stroke-width="1" />
  
  <!-- Buttons -->
  <circle cx="22" cy="17" r="5.5" fill="#ef4444" />
  <circle cx="39" cy="17" r="5.5" fill="#f59e0b" />
  <circle cx="56" cy="17" r="5.5" fill="#10b981" />

  <text x="460" y="21" text-anchor="middle" class="mono term-title">habib@blackwell-edge: ~ (zsh / molab-cli v2.5)</text>

  <!-- Terminal Session -->
  <g transform="translate(24, 62)" class="mono">
    <!-- Command 1: Discovery -->
    <text x="0" y="0"><tspan class="t-prompt">habib@blackwell-edge</tspan><tspan fill="#64748b">:</tspan><tspan fill="#818cf8">~</tspan><tspan fill="#64748b">$</tspan> <tspan class="t-cmd">molab free --json</tspan></text>
    
    <!-- JSON Output -->
    <text x="0" y="22"><tspan class="t-dim">{</tspan></text>
    <text x="16" y="42"><tspan class="t-key">&quot;target_pod&quot;</tspan><tspan class="t-dim">: </tspan><tspan class="t-str">&quot;pod-bw-96gb-01&quot;</tspan><tspan class="t-dim">,</tspan></text>
    <text x="16" y="62"><tspan class="t-key">&quot;hardware&quot;</tspan><tspan class="t-dim">: </tspan><tspan class="t-str">&quot;NVIDIA RTX PRO 6000 Blackwell (96GB GDDR7)&quot;</tspan><tspan class="t-dim">,</tspan></text>
    <text x="16" y="82"><tspan class="t-key">&quot;memory_bandwidth&quot;</tspan><tspan class="t-dim">: </tspan><tspan class="t-str">&quot;1.76 TB/s&quot;</tspan><tspan class="t-dim">,</tspan> <tspan class="t-key">&quot;vram_free&quot;</tspan><tspan class="t-dim">: </tspan><tspan class="t-num">95.4</tspan></text>
    <text x="0" y="102"><tspan class="t-dim">}</tspan></text>

    <!-- Command 2: Deployment -->
    <text x="0" y="134"><tspan class="t-prompt">habib@blackwell-edge</tspan><tspan fill="#64748b">:</tspan><tspan fill="#818cf8">~</tspan><tspan fill="#64748b">$</tspan> <tspan class="t-cmd">molab deploy qwen-32b --engine vllm --flashinfer --apc</tspan></text>

    <text x="0" y="160"><tspan class="t-success">✓</tspan> <tspan class="t-val">Kernel Dispatch: FlashInfer fused attention compiler active</tspan></text>
    <text x="0" y="182"><tspan class="t-success">✓</tspan> <tspan class="t-val">Automatic Prefix Caching (APC): SATURATED (hit rate &gt; 94.8%)</tspan></text>
    <text x="0" y="204"><tspan class="t-success">✓</tspan> <tspan class="t-val">Chunked Prefill: 512 tokens / dispatch | TTFT: </tspan><tspan class="t-info">72ms</tspan></text>
    <text x="0" y="226"><tspan class="t-success">✓</tspan> <tspan class="t-val">Unified Ingress: Dual-format /v1/chat/completions (OpenAI &amp; Anthropic)</tspan></text>
    <text x="0" y="248"><tspan class="t-success">✓</tspan> <tspan class="t-val">Local Bridge: Listening on </tspan><tspan class="t-str">http://localhost:8000</tspan></text>

    <!-- Command 3: Next prompt -->
    <text x="0" y="284"><tspan class="t-prompt">habib@blackwell-edge</tspan><tspan fill="#64748b">:</tspan><tspan fill="#818cf8">~</tspan><tspan fill="#64748b">$</tspan> <tspan class="t-cmd">tacp swarm-dispatch --agents hermes,cli-anything</tspan></text>
    <rect x="485" y="271" width="8.5" height="15" class="cursor-box" />
  </g>
</svg>