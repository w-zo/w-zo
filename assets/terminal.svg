<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="terminalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseLed {
      0%, 100% { fill: #34d399; filter: drop-shadow(0 0 6px #34d399); }
      50% { fill: #10b981; filter: drop-shadow(0 0 2px #10b981); }
    }
    .text-title { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; fill: #94a3b8; font-weight: 600; }
    .text-prompt { font-family: 'Fira Code', monospace; font-size: 14px; fill: #38bdf8; font-weight: bold; }
    .text-key { font-family: 'Fira Code', monospace; font-size: 13px; fill: #818cf8; font-weight: 600; }
    .text-val { font-family: 'Fira Code', monospace; font-size: 13px; fill: #e2e8f0; }
    .text-hl { font-family: 'Fira Code', monospace; font-size: 13px; fill: #34d399; font-weight: bold; }
    .text-cyan { font-family: 'Fira Code', monospace; font-size: 13px; fill: #38bdf8; }
    .text-ascii { font-family: 'Fira Code', monospace; font-size: 11px; fill: #38bdf8; opacity: 0.95; }
    .cursor { animation: blink 1s infinite; fill: #38bdf8; }
    .led { animation: pulseLed 2s infinite ease-in-out; }
  </style>

  <!-- Outer Card Frame -->
  <rect x="2" y="2" width="846" height="416" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" />
  <rect x="4" y="4" width="842" height="412" rx="12" fill="url(#terminalBg)" />

  <!-- Terminal Window Bar -->
  <path d="M 4 16 C 4 9.37 9.37 4 16 4 L 834 4 C 840.63 4 846 9.37 846 16 L 846 38 L 4 38 Z" fill="#0f172a" />
  <line x1="4" y1="38" x2="846" y2="38" stroke="#1e293b" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="26" cy="21" r="6" fill="#ef4444" />
  <circle cx="44" cy="21" r="6" fill="#f59e0b" />
  <circle cx="62" cy="21" r="6" fill="#10b981" />

  <text x="425" y="25" text-anchor="middle" class="text-title">⚡ habib@blackwell-node:~ (zsh)</text>

  <!-- Shell Command Line -->
  <text x="30" y="68" class="text-prompt">habib@blackwell-node<tspan fill="#94a3b8">:</tspan><tspan fill="#818cf8">~</tspan><tspan fill="#94a3b8">$</tspan> <tspan fill="#f8fafc">fastfetch --cluster gpu-blackwell-96gb</tspan></text>

  <!-- Left Side: Futuristic Neural Core ASCII Art -->
  <g transform="translate(30, 85)">
    <text x="0" y="20" class="text-ascii">         .---.        </text>
    <text x="0" y="36" class="text-ascii">        /  / \ \      </text>
    <text x="0" y="52" class="text-ascii">       |  |   | |     </text>
    <text x="0" y="68" class="text-ascii">   .---'  '---'  '---.</text>
    <text x="0" y="84" class="text-ascii">  /   ⚡ BLACKWELL ⚡  \</text>
    <text x="0" y="100" class="text-ascii"> |  RTX PRO 6000 96GB |</text>
    <text x="0" y="116" class="text-ascii">  \   [VLLM+KERNELS]  /</text>
    <text x="0" y="132" class="text-ascii">   '---.  .---.  .---'</text>
    <text x="0" y="148" class="text-ascii">       |  |   | |     </text>
    <text x="0" y="164" class="text-ascii">        \  \ /  /     </text>
    <text x="0" y="180" class="text-ascii">         '---'        </text>
    <text x="0" y="205" class="text-ascii" fill="#818cf8">  [=================] </text>
    <text x="0" y="222" class="text-ascii" fill="#34d399">  ● NEURAL FABRIC OK  </text>
  </g>

  <!-- Middle Divider Line -->
  <line x1="280" y1="85" x2="280" y2="380" stroke="#1e293b" stroke-dasharray="4,4" />

  <!-- Right Side: Fastfetch Telemetry -->
  <g transform="translate(305, 100)">
    <!-- Identity -->
    <text x="0" y="10" class="text-key">USER</text>
    <text x="135" y="10" class="text-val">: Habib (<tspan class="text-cyan">w-zo</tspan>)</text>

    <text x="0" y="32" class="text-key">ROLE</text>
    <text x="135" y="32" class="text-val">: AI Systems &amp; Autonomous Agents Architect</text>

    <text x="0" y="54" class="text-key">ENVIRONMENT</text>
    <text x="135" y="54" class="text-val">: Arch Linux / Android Termux (aarch64)</text>

    <!-- Compute Specs -->
    <text x="0" y="76" class="text-key">GPU CLUSTER</text>
    <text x="135" y="76" class="text-hl">: NVIDIA RTX PRO 6000 Blackwell (96GB VRAM)</text>

    <text x="0" y="98" class="text-key">ENGINE ACCEL</text>
    <text x="135" y="98" class="text-val">: FlashInfer + Triton Kernels + Chunked Prefill</text>

    <text x="0" y="120" class="text-key">INFERENCE LATENCY</text>
    <text x="135" y="120" class="text-val">: <tspan class="text-hl">&lt; 78ms TTFT</tspan> (94.8% Prefix Cache Hit)</text>

    <text x="0" y="142" class="text-key">ACTIVE SWARMS</text>
    <text x="135" y="142" class="text-val">: Hermes Orchestrator, TAC-P, Teleclaw Bot</text>

    <text x="0" y="164" class="text-key">PRIMARY STACK</text>
    <text x="135" y="164" class="text-cyan">: Python, Rust, TypeScript, PyTorch, CUDA, vLLM</text>

    <text x="0" y="186" class="text-key">UPTIME</text>
    <text x="135" y="186" class="text-val">: 24/7 autonomous keepalive supervisor</text>

    <!-- Status Line with Pulsing LED -->
    <text x="0" y="214" class="text-key">SYSTEM STATUS</text>
    <text x="135" y="214" class="text-val">:</text>
    <circle cx="150" cy="210" r="4.5" class="led" />
    <text x="162" y="214" class="text-hl">ALL CORES SATURATED &amp; DEPLOYED</text>

    <!-- Command Prompt at Bottom with blinking cursor -->
    <text x="0" y="254" class="text-prompt">habib@blackwell-node<tspan fill="#94a3b8">:</tspan><tspan fill="#818cf8">~</tspan><tspan fill="#94a3b8">$</tspan> <tspan fill="#f8fafc">./orchestrate_future.sh --release</tspan></text>
    <rect x="365" y="242" width="9" height="15" class="cursor" />
  </g>
</svg>
